<div class="auth-container">
  <div class="auth-top-actions">
    <app-theme-toggle></app-theme-toggle>
    <app-language-switcher></app-language-switcher>
  </div>
  <div class="auth-card">
    <div class="brand-icon">🌱 PlantIQ</div>
    <div class="icon-wrapper">📧</div>
    <h2>{{ 'AUTH.FORGOT.TITLE' | translate }}</h2>
    <p>{{ 'AUTH.FORGOT.SUBTITLE' | translate }}</p>

    @if (errorMessage()) {
      <div class="error-alert">{{ errorMessage() | translate }}</div>
    }

    <div class="form-group">
      <label>{{ 'AUTH.EMAIL_LABEL' | translate }}</label>
      <input
        type="email"
        placeholder="your@email.com"
        [(ngModel)]="email"
        [disabled]="isLoading()"
        (keyup.enter)="submit()"
      >
    </div>

    <button class="primary-btn" (click)="submit()" [disabled]="isLoading()">
      @if (isLoading()) {
        <span class="spinner"></span> {{ 'AUTH.FORGOT.SENDING' | translate }}
      } @else {
        {{ 'AUTH.FORGOT.BTN' | translate }}
      }
    </button>

    <div class="auth-links">
      <a routerLink="/login">← {{ 'AUTH.FORGOT.BACK_TO_LOGIN' | translate }}</a>
    </div>
  </div>
</div>
