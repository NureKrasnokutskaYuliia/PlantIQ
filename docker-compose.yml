services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: plantiq
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: krsnktska
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=plantiq;Username=postgres;Password=krsnktska"
      Jwt__Key: "SuperSecretKey12345678901234567890"
      Jwt__Issuer: "PlantIQ_API"
      Jwt__Audience: "PlantIQ_Client"
    depends_on:
      db:
        condition: service_healthy
    deploy:
      replicas: 1

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - api

volumes:
  pgdata:
